<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>My orders · Tropical Distillery Team Merch</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/shop">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#135E52"/><ellipse cx="31" cy="37" rx="14" ry="16.5" transform="rotate(-22 31 37)" fill="#F29E38"/><path d="M33 21c4-8 11-10 17-8-3 6-9 9-17 8Z" fill="#8DBF3F"/><path d="M32 22c-1-4 0-7 2-10" stroke="#FBF8F2" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
        <span class="brand-name">Tropical Distillery<span class="brand-sub">Team merch store</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/shop">Shop</a>
        <a href="/orders" aria-current="page">My orders</a>
      </nav>
      <div class="header-actions">
        <div class="user-chip"><span class="who">Signed in as <strong data-user-name></strong></span><button type="button" class="link-button" data-sign-out>Sign out</button></div>
        <a class="cart-button" href="/shop?cart=open" data-cart-open><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>Order</span><span class="cart-count" data-cart-count>0</span></a>
      </div>
    </div>
  </header>
  <main id="main" class="page">
    <div class="page-head">
      <div>
        <p class="eyebrow">My orders</p>
        <h1>Your merch orders</h1>
        <p class="lede">Track approval and shipping, cancel an order that hasn't been approved yet, or reorder in one click.</p>
      </div>
      <a class="btn btn-secondary" href="/shop">Back to the shop</a>
    </div>
    <div id="placed-banner"></div>
    <div class="order-list" id="order-list" aria-busy="true">
      <div class="skeleton"></div>
    </div>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/assets/orders.js"></script>
</body>
</html>
